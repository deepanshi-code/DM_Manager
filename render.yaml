# One-click hosted demo on Render (https://render.com): New → Blueprint → pick this repository.
# One web service runs the API and serves the built dashboard, with a free PostgreSQL database.
# Synthetic demo data is reloaded at startup when it is older than 6 hours (free instances
# restart after being idle), so the demo is always fresh. No real customer data.
services:
  - type: web
    name: dm-manager
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    # Run node directly (no npm wrapper process) and cap the JS heap to stay well inside 512 MB.
    startCommand: cd server && node --max-old-space-size=192 src/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Real PostgreSQL (the embedded one needs more memory than the free plan's 512 MB).
      - key: DATABASE_URL
        fromDatabase:
          name: dm-manager-db
          property: connectionString
      - key: SERVE_CLIENT
        value: "true"
      - key: DEMO_SEED
        value: "true"
      # Public demo with synthetic data: open without login. For real customers use AUTH=on and
      # REMOVE DEMO_SEED (it wipes the database; the server refuses to start with both).
      - key: AUTH
        value: "off"
      - key: SENDER
        value: simulated
      - key: SLA_SECONDS
        value: "300"
      - key: TRUST_PROXY
        value: "1"
      # Random secrets so nobody can post fake webhooks to the public demo.
      - key: IG_APP_SECRET
        generateValue: true
      - key: IG_VERIFY_TOKEN
        generateValue: true

databases:
  # Free plan: check Render's current limits (free databases have expired after 30 days).
  - name: dm-manager-db
    plan: free
    databaseName: dm_manager
    user: dm_manager
